<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — PureDivine Energy</title>
    <meta name="description" content="Verify your PureDivine Energy healing course certificate instantly.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="/assets/af676219824285083bd9.css"
        rel="stylesheet">
    <style>
        :root {
            --font-display: 'Cormorant Garamond', Georgia, serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
            --gold: #8b6914;
            --gold-light: #f0e4c8;
            --gold-hover: #6e5210;
            --green: #3a6b2a;
            --green-light: #d4e8cc;
            --red: #8b2a2a;
            --red-light: #f0d4d4;
            --bg: #faf7f2;
            --surface: #fdf9f4;
            --border: #d9d0c1;
            --text: #2a2118;
            --muted: #7a6e5f;
            --faint: #b0a593;
            --radius: 0.75rem;
            --radius-lg: 1rem;
            --radius-full: 9999px;
            --shadow: 0 4px 16px oklch(0.2 0.02 60 / 0.10);
            --shadow-lg: 0 12px 40px oklch(0.2 0.02 60 / 0.14);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text);
            background: var(--bg);
            min-height: 100dvh;
            line-height: 1.6;
        }

        img {
            display: block;
            max-width: 100%;
        }

        input,
        button,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            background: none;
            border: none;
        }

        h1,
        h2,
        h3,
        h4 {
            text-wrap: balance;
        }

        :focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(250, 247, 242, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
        }

        .header-inner {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            text-decoration: none;
            color: inherit;
        }

        .logo-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .logo-sub {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            display: block;
        }

        .nav-link {
            font-size: 0.875rem;
            color: var(--muted);
            text-decoration: none;
            padding: 0.375rem 0.75rem;
            border-radius: 0.5rem;
            transition: all 180ms ease;
        }

        .nav-link:hover {
            color: var(--text);
            background: #f3ede3;
        }

        .nav-link.active {
            color: var(--gold);
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .container--narrow {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* Alerts */
        .alert {
            padding: 0.875rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .alert-success {
            background: var(--green-light);
            color: var(--green);
            border: 1px solid #b8d8b0;
        }

        .alert-error {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid #ddb8b8;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 180ms ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--gold);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--gold-hover);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-danger {
            background: var(--red-light);
            color: var(--red);
            border: 1px solid #ddb8b8;
        }

        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.8rem;
        }

        /* Footer */
        .footer {
            margin-top: 4rem;
            padding: 2rem 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer p {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .footer a {
            color: var(--gold);
            text-decoration: none;
        }
    </style>
        <style>
        .login-wrap {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }

        .login-icon {
            width: 52px;
            height: 52px;
            background: var(--gold-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: var(--gold);
        }

        .login-card h2 {
            font-family: var(--font-display);
            font-size: 1.625rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.375rem;
        }

        .login-card p {
            font-size: 0.875rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .form-group {
            margin-bottom: 1.125rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 0.9375rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(139, 105, 20, 0.12);
        }

        .form-error {
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 0.375rem;
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-inner">
            <a href="/verify/" class="logo">
                <img src="/assets/502f55d0a433b8530a19.png" alt="PureDivine Energy"
                    style="width:42px;height:42px;object-fit:contain;">
                <span>
                    <span class="logo-title">PureDivine Energy</span>
                    <span class="logo-sub">Certificate Verification</span>
                </span>
            </a>
            <nav style="display:flex;align-items:center;gap:0.25rem;">
                <a href="/verify/"
                    class="nav-link ">Verify</a>
                                    <a href="/verify/admin/login" class="nav-link">Admin</a>
                            </nav>
        </div>
    </header>

    <main>
            <div class="login-wrap">
        <div class="login-card">
            <div class="login-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            </div>
            <h2>Admin Login</h2>
            <p>Sign in to manage certificates</p>

            <form method="POST" action="/verify/admin/login">
                                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" value=""
                        required autofocus>
                                    </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.5rem">
                    Sign In
                </button>
            </form>
        </div>
    </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 PureDivine Energy &nbsp;·&nbsp; <a
                    href="mailto:support@puredivineenergy.com">support@puredivineenergy.com</a> &nbsp;·&nbsp;
                verify.puredivineenergy.com</p>
            <p style="margin-top:0.375rem">All certificates are digitally issued and tamper-evident. Certificate IDs are
                unique and non-transferable.</p>
        </div>
    </footer>
    <script src="/clone-support.js"></script><script src="/clone-chat.js"></script></body>

</html>
